  <!-- Immediate Theme & Accent Loader (Prevents theme flash on load) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('BRIDGES_THEME');
        var a = localStorage.getItem('BRIDGES_ACCENT');
        if (t && t !== 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
        if (a) {
          document.documentElement.style.setProperty('--color-royal-navy', a);
        }
      } catch (e) { }
    })();
  </script>

        </button>
      </div>
      <div class="modal-body">
        <p class="confirm-message">Are you sure you wish to proceed?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm"
          onclick="UI.closeModal('app-confirm-modal')">Cancel</button>
        <button type="button" class="btn btn-danger btn-sm" id="confirm-modal-action-btn">Confirm</button>

    </div>
  </div>
